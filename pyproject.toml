[project]
name = "hello-world"
version = "0.1.0"
description = "Projeto inicial Hello World em Python"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["teste"]
python_files = ["teste_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
